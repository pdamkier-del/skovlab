name: Analytical ECD local-bounce audit
on:
  push:
    paths:
      - 'research/ec-analytical-bounce/**'
      - 'research/ec-full-3plus1/ecd.py'
      - '.github/workflows/ec-analytical-bounce.yml'
  pull_request:
    paths:
      - 'research/ec-analytical-bounce/**'
      - 'research/ec-full-3plus1/ecd.py'
      - '.github/workflows/ec-analytical-bounce.yml'
permissions:
  contents: read
jobs:
  symbolic-and-regression-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: python -m pip install -r research/ec-full-3plus1/requirements.txt -r research/ec-spherical/requirements.txt
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: python research/ec-analytical-bounce/validation/run_checks.py
