name: Reduced classical ECD laboratory
on:
  push:
    paths:
      - 'research/ec-dirac-collapse/**'
      - '.github/workflows/ec-dirac-collapse.yml'
  pull_request:
    paths:
      - 'research/ec-dirac-collapse/**'
      - '.github/workflows/ec-dirac-collapse.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: python -m pip install -r research/ec-spherical/requirements.txt
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: python research/ec-dirac-collapse/validation/run_checks.py
